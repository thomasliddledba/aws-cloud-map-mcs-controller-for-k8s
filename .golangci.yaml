version: "2"
run:
  concurrency: 4
  issues-exit-code: 1
linters:
  enable:
    - dupl
    - goconst
    - gocritic
    - misspell
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
    goconst:
      min-len: 2
      min-occurrences: 3
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - .*_mock\.go$
      - mocks/
      - pkg/apis/
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - .*_mock\.go$
      - mocks/
      - pkg/apis/
